:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mut:#9aa1ab;--bd:#2f343b;--ac:#6b9bff;--acx:#0b1220;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:132px;aspect-ratio:300/105;padding:7px;box-sizing:content-box;background:#17191d var(--logo) center/contain no-repeat;background-origin:content-box;border-radius:10px}.foot{display:flex;justify-content:flex-end;margin-top:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}.chip{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:2px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
nav button{white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.fin{background:var(--ok);color:#fff;border-color:var(--ok)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.dangerx{background:var(--bad);color:#fff;border-color:var(--bad)}
.badge{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--bd);font-size:12px}
nav button.on .badge{background:rgba(255,255,255,.25)}
input,select,textarea{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 10px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.num{font-weight:700;font-size:17px}.mut{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.filter{margin-bottom:10px}.empty{text-align:center;color:var(--mut);padding:28px 0}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}th{font-size:12px;color:var(--mut)}.item{display:flex;justify-content:space-between;border-top:1px dashed var(--bd);padding:6px 0}
.item button{padding:2px 8px}.bad{color:var(--bad)}.okc{color:var(--ok)}
.add{display:grid;grid-template-columns:2fr 1fr auto;gap:6px;margin-top:8px}
.sg{margin-top:8px}.sg button{min-width:84px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
#toast.s{opacity:1}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);margin-left:8px;vertical-align:middle}
.pill{color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;align-self:flex-start}
.prog{display:flex;gap:3px;margin:4px 0 10px}.prog span{flex:1;height:5px;border-radius:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
nav button .badge.late{background:var(--bad);color:#fff}
.card button.fin{padding:10px 16px;font-weight:600}
@media (max-width:600px){.card button.fin{width:100%}}
.shell{display:flex;min-height:100vh}
#side{width:250px;flex:none;background:var(--card);border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side nav{flex-direction:column;overflow:visible;padding:0;margin:0;flex:1;gap:4px}
#side nav button{text-align:left;width:100%;display:flex;align-items:center}
#side nav button .badge{margin-left:auto}
.content{flex:1;min-width:0;max-width:1100px;padding:16px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#menuBtn,#scrim{display:none}
@media (max-width:800px){
 #side{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.25)}
 body.menu #side{transform:none}
 body.menu #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
 #menuBtn{display:inline-block}
}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(234,88,12,.5)}50%{box-shadow:0 0 0 10px rgba(234,88,12,0)}}
.acao{border-color:var(--wc);animation:pulso 1.8s infinite}
.avisoacao{display:flex;gap:12px;align-items:center;background:var(--wc);color:#fff;border-radius:10px;padding:10px 12px;margin:-4px 0 12px;font-weight:700}
.avisoacao .ic{font-size:28px}.avisoacao small{display:block;font-weight:400}
.sec{font-weight:700;margin:16px 0 8px}
.card button.big{width:100%;padding:16px;font-size:17px;font-weight:700;border-radius:12px}
.escolha{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.escolha button{padding:16px 8px;font-size:16px;font-weight:700;border-radius:12px;border-width:2px}
.escolha button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.escolha button.nok.on{background:var(--bad);border-color:var(--bad);color:#fff}
nav button .badge.acaoB{background:#ea580c;color:#fff;animation:pulso 1.8s infinite}
/* ===== Visual refinado ===== */
:root{--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.07)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1100px 480px at 90% -10%,rgba(29,78,216,.09),transparent 60%),var(--bg)}
#side{background:#15171b;border-right:0;padding:18px 14px}
#side .chip{color:#aeb4bd;border-color:#2c3037;background:transparent}
#side nav button{background:transparent;border:0;color:#c3c8d0;padding:10px 12px;border-radius:10px;font-weight:500}
#side nav button:hover{background:rgba(255,255,255,.07)}
#side nav button.on{background:var(--ac);color:#fff;font-weight:600}
#side nav .badge{background:rgba(255,255,255,.14);color:#fff}
#side nav .badge.late{background:var(--bad)}
#side nav .badge.acaoB{background:#ea580c}
.topbar{position:sticky;top:0;z-index:10;margin:-16px -16px 16px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hello{flex:1;min-width:0}
.hello h1{font-size:18px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saud{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:2px}
.sair{border-radius:99px;padding:8px 18px;font-weight:600;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--bd))}
.sair:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
#menuBtn{padding:8px 12px;font-size:18px;line-height:1}
.card{border-radius:16px;box-shadow:var(--sh);padding:16px 18px}
.pill{padding:4px 12px}
.prog span{height:6px}
.avisoacao{border-radius:14px}
button{border-radius:10px;font-weight:600;transition:background .15s,border-color .15s,transform .08s}
button:hover{border-color:var(--ac)}
button:active{transform:scale(.98)}
button.fin{box-shadow:0 2px 8px color-mix(in srgb,var(--ok) 35%,transparent)}
input,select,textarea{border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:2px}
th{background:color-mix(in srgb,var(--bd) 35%,transparent);font-weight:600}
tbody tr:hover{background:color-mix(in srgb,var(--bd) 25%,transparent)}
#login .card{padding:26px;box-shadow:0 12px 40px rgba(16,24,40,.14)}
@media (prefers-reduced-motion:reduce){.acao,nav button .badge.acaoB{animation:none}}
/* ===== Topo nas cores da logo da Setta ===== */
:root{--ac:#005ca8;--sy:#fff80b}
body{background:radial-gradient(1100px 480px at 90% -10%,rgba(0,92,168,.12),transparent 60%),var(--bg)}
#side{background:linear-gradient(180deg,#00467f 0%,#0a2540 100%);border-top:4px solid var(--sy)}
#side nav button.on{background:var(--sy);color:#00305c}
.topbar{background:linear-gradient(120deg,#0a4f8f 0%,#005ca8 55%,#0b6fc4 100%);border-bottom:4px solid var(--sy);border-radius:0 0 20px 20px;margin:-16px -16px 18px;padding:16px 20px;box-shadow:0 10px 28px rgba(0,92,168,.30);-webkit-backdrop-filter:none;backdrop-filter:none}
.topbar .saud{color:var(--sy);font-weight:700;letter-spacing:.2px}
.topbar h1{color:#fff;font-size:20px}
.topbar #menuBtn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.topbar .sair{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.topbar .sair:hover{background:var(--sy);color:#00305c;border-color:var(--sy)}
@media (max-width:600px){.topbar{padding:12px 14px}.topbar h1{font-size:16px}}
</style>

<body>
<div class="wrap" id="login" style="max-width:380px;display:none;margin-top:8vh">

<div class="card"><h1 style="font-size:18px">Monitoramento de Pedidos Setta</h1>

<div id="app" style="display:none"><div class="shell">
<aside id="side"><div class="logo" role="img" aria-label="Setta Papelaria"></div><span class="chip" id="who" style="align-self:flex-start"></span><nav id="nav"></nav></aside>
<div id="scrim"></div>
<section class="content">
<div class="bar topbar"><button id="menuBtn" aria-label="Abrir menu">☰</button><div class="hello"><span id="saud" class="saud"></span><h1>Monitoramento de Pedidos Setta</h1></div><button id="out" class="sair">Sair</button></div>
<input id="busca" type="search" placeholder="🔍 Buscar pedido (nº do pedido ou da NF)" style="margin-bottom:10px">
<main id="main"></main>
<footer class="foot"><div class="logo" role="img" aria-label="Setta Papelaria"></div></footer>
</section></div></div>

function actions(o){

function carregaScript(src){return new Promise(function(ok,erro){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){erro(new Error('falha ao carregar '+src))};document.head.appendChild(s)})}
function pdfTxt(s){return String(s||'').replace(/→/g,'->').replace(/[−–—]/g,'-').replace(/[^\u0020-\u00ff]/g,'').replace(/\s+/g,' ').trim()}

    d.autoTable({html:tb,startY:y+4,margin:{left:32,right:32,bottom:36},theme:'grid',styles:{font:'helvetica',fontSize:9,cellPadding:4},headStyles:{fillColor:[0,92,168],textColor:255},alternateRowStyles:{fillColor:[240,246,252]},

}function mesChave(o){var d=new Date(o.criado||o.atualizado||0);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
function mesNome(k){var x=k.split('-'),s=new Date(+x[0],+x[1]-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}
function relatorio(){
  var P={},todos=Object.values(orders),comErro=0,atual=mesChave({criado:Date.now()}),ms={};
  ms[atual]=1;todos.forEach(function(o){ms[mesChave(o)]=1});
  var mk=mesSel||atual,all=mk==='todos'?todos:todos.filter(function(o){return mesChave(o)===mk});
  var sel='<div class="card row"><span class="mut">Mês:</span><select class="mes" style="max-width:240px">'+Object.keys(ms).sort().reverse().map(function(k){return '<option value="'+k+'"'+(k===mk?' selected':'')+'>'+mesNome(k)+(k===atual?' (atual)':'')+'</option>'}).join('')+'<option value="todos"'+(mk==='todos'?' selected':'')+'>Todos os meses</option></select><button class="fin" data-a="pdf" style="margin-left:auto">📄 Baixar PDF</button></div>';
  function pes(n){n=(n||'').trim();if(!n)return null;var k=n.toLowerCase();return P[k]||(P[k]={nome:n,sep:0,conf:0,emb:0,ent:0,nf:0,esep:0,econf:0,eemb:0,ped:{}})}
  function cel(n,e){return '<td><b>'+n+'</b>'+(e?' <span class="bad">· '+e+' erro'+(e>1?'s':'')+'</span>':'')+'</td>'}
  all.forEach(function(o){
    var err=o.correcao===true&&(o.status==='correcao'||o.status==='finalizado'),a;
    if(err)comErro++;
    if(a=pes(o.separador)){a.ped[o.id]=1;if(o.status!=='separacao'){a.sep++;if(err)a.esep++}}
    if(a=pes(o.conferiu)){a.ped[o.id]=1;a.conf++;if(err)a.econf++}
    if(a=pes(o.embalou)){a.ped[o.id]=1;a.emb++;if(err)a.eemb++}
    if(a=pes(o.conferiuEntrega)){a.ped[o.id]=1;a.ent++}
    if(['aguardando','conferencia','correcao','finalizado'].indexOf(o.status)>=0&&(a=pes('Igor'))){a.ped[o.id]=1;a.nf++}
  });
  var rows=Object.values(P).sort(function(a,b){return (Object.keys(b.ped).length-Object.keys(a.ped).length)||((b.sep+b.conf+b.emb+b.nf+b.ent)-(a.sep+a.conf+a.emb+a.nf+a.ent))});
  var h=sel+'<div class="card"><b>'+all.length+'</b> pedidos '+(mk==='todos'?'no total':'em '+mesNome(mk))+' · <span class="bad"><b>'+comErro+'</b> com correção</span></div>';
  var tt=all.filter(function(o){return o.status==='finalizado'&&o.criado&&o.finalizadoEm}).map(function(o){return o.finalizadoEm-o.criado});
  if(tt.length){var mm=function(ms){return dur({criado:0,finalizadoEm:ms})};h+='<div class="card">⏱ Tempo do pedido (cadastro → finalizado), em <b>'+tt.length+'</b> pedidos finalizados: média <b>'+mm(tt.reduce(function(a,b){return a+b},0)/tt.length)+'</b> · mais rápido <b>'+mm(Math.min.apply(null,tt))+'</b> · mais demorado <b>'+mm(Math.max.apply(null,tt))+'</b></div>'}
  if(!rows.length)return h+'<div class="empty">Ainda não há atividades registradas.</div>';
  h+='<div class="card" style="overflow-x:auto"><table><thead><tr><th>Pessoa</th><th>Separações</th><th>Conferências</th><th>Embalagens</th><th>NF</th><th>Conf. de entrega</th><th>Total de participação</th><th>Total de erros</th><th>% de acerto</th><th>Pedidos em que atuou</th><th>% de participação</th></tr></thead><tbody>';
  rows.forEach(function(p){var te=p.esep+p.econf+p.eemb,tf=p.sep+p.conf+p.emb,pc=tf?(((tf-te)/tf)*100).toFixed(1).replace('.',',')+'%':'—',np=Object.keys(p.ped).length,pp=(np/all.length*100).toFixed(1).replace('.',',')+'%';
    h+='<tr><td><b>'+esc(p.nome)+'</b></td>'+cel(p.sep,p.esep)+cel(p.conf,p.econf)+cel(p.emb,p.eemb)+'<td><b>'+p.nf+'</b></td><td><b>'+p.ent+'</b></td><td><b>'+(p.sep+p.conf+p.emb+p.nf+p.ent)+'</b></td><td class="'+(te?'bad':'mut')+'"><b>'+te+'</b></td><td><b>'+pc+'</b></td><td><b>'+np+'</b> de '+all.length+'</td><td><b>'+pp+'</b></td></tr>'});
  return h+'</tbody></table></div><div class="mut">Erro = pedido que precisou de correção na conferência de entrega, contado para o separador, o conferente e o embalador daquele pedido. % de acerto = (separações + conferências + embalagens − erros) ÷ (separações + conferências + embalagens). % de participação = pedidos em que a pessoa aparece (separou, conferiu, embalou, NF ou conferiu a entrega) ÷ total de pedidos do período; cada pedido conta uma vez por pessoa, mesmo que ela tenha feito mais de uma função nele. Cada pedido conta no mês em que foi cadastrado.</div>';
}
function atualizaSaudacao(){
  if(!me)return;
  var h=new Date().getHours(),
      t=h>=5&&h<12?['☀️','Bom dia']:h>=12&&h<18?['🌤️','Boa tarde']:['🌙','Boa noite'],
      n=me.role==='admin'?(me.user==='hebert'?'Hebert':'Igor'):me.role==='separador'?'equipe de Separação':me.role==='entregador'?'Entregador':me.filial,
      el=document.getElementById('saud');
  if(el)el.textContent=t[0]+' '+t[1]+', '+n+'!';
}

  if(tab!=='novo'&&tl.indexOf(tab)<0)tab=tl[0];
  var nav=(isFilial()||isEntregador())?'':'<button data-a="tab" data-v="novo" class="'+(tab==='novo'?'on':'')+'">+ Novo pedido</button>';
  tl.forEach(function(k){var cr=COR[k],on=tab===k&&!busca,late=Object.values(orders).filter(function(o){return naAba(o,k)&&atraso(o)===2}).length,acn=isFilial()&&k==='andamento'?Object.values(orders).filter(minhaAcao).length:0;
    nav+='<button data-a="tab" data-v="'+k+'" class="'+(on?'on':'')+'"'+(on&&cr?' style="background:'+cr+';border-color:'+cr+';color:#fff"':'')+'>'+(k==='relatorio'?'Relatório':'<i class="dot" style="background:'+cr+'"></i>'+(ST[k]||NOMES[k])+'<span class="badge'+(late?' late':'')+'">'+count(k)+'</span>'+(acn?'<span class="badge acaoB">'+acn+' p/ você</span>':''))+'</button>'});
  document.getElementById('nav').innerHTML=nav;
  var m=document.getElementById('main');
  if(busca){var qq=busca.toLowerCase(),rs=Object.values(orders).filter(function(o){return (String(o.numero)+' '+String(o.nfNumero||'')).toLowerCase().indexOf(qq)>=0}).sort(function(a,b){return (b.atualizado||0)-(a.atualizado||0)});m.innerHTML='<div class="mut" style="margin-bottom:8px">Resultados da busca em todas as etapas: '+rs.length+'</div>'+(rs.length?rs.map(card).join(''):'<div class="empty">Nenhum pedido encontrado.</div>');return}
  if(tab==='novo'){
    var fo=FILIAIS.map(function(x){return '<button data-a="dfilial" data-v="'+esc(x)+'" class="'+(draft.filial===x?'on':'')+'">'+esc(x)+'</button>'}).join('');
    if(!seeAll())fo='<span class="chip">'+esc(me.filial)+'</span>';
    var so=btns().map(function(b){return '<button data-a="dst" data-v="'+b[0]+'" class="'+(draft.st===b[0]?'on':'')+'">'+b[1]+'</button>'}).join('');
    m.innerHTML='<div class="card"><label>Número do pedido</label><input id="num" inputmode="numeric" value="'+esc(draft.num)+'" placeholder="Ex.: 12345"><label>Filial</label><div class="row">'+fo+'</div><label>Status do pedido</label><div class="row">'+so+'</div>'+(draft.st==='separacao'?nameSel('nsep',SEPS,'Separador:'):'')+'<div style="margin-top:14px"><button class="fin" data-a="add">Processar pedido</button></div></div>'+(recentes.length?'<div class="card"><div class="mut" style="margin-bottom:4px">Últimos cadastrados</div>'+recentes.map(function(r){return '<div class="item"><span><b>'+esc(r.numero)+'</b> · '+esc(r.filial)+'</span><span class="mut">'+esc(r.etapa)+'</span></div>'}).join('')+'</div>':'');
    var s=m.querySelector('.nsep');
    if(s&&draft.sep){s.value=draft.sep;if(s.value==='__outro'){var oo=m.querySelector('.nsepo');oo.style.display='block';oo.value=draft.sepo}}
    if(draft.foco){draft.foco=false;var ni=m.querySelector('#num');if(ni)ni.focus()}
    return;
  }
  if(tab==='relatorio'){m.innerHTML=relatorio();return}
  var f=!seeAll()?'':'<div class="filter row"><span class="mut">Filial:</span>'+['todas'].concat(FILIAIS).map(function(x){return '<button data-a="filtro" data-v="'+esc(x)+'" class="'+(filtro===x?'on':'')+'">'+(x==='todas'?'Todas':esc(x))+'</button>'}).join('')+'</div>';
  var l=list(tab),rs0='';
  if(tab==='andamento'&&l.length)rs0='<div class="row" style="margin-bottom:10px">'+['conferencia','aguardando','nf','conferido','separacao'].map(function(k){var n=l.filter(function(o){return o.status===k}).length;return n?'<span class="chip"><i class="dot" style="background:'+COR[k]+'"></i>'+ST[k]+': <b>'+n+'</b></span>':''}).join('')+'</div>';
  if(tab==='andamento'&&isFilial()){var ac=l.filter(minhaAcao),ou=l.filter(function(o){return !minhaAcao(o)});m.innerHTML=rs0+(ac.length?'<div class="sec">🔔 Precisam da sua ação ('+ac.length+')</div>'+ac.map(card).join(''):'<div class="card">🎉 Nada pendente com você agora.</div>')+(ou.length?'<div class="sec">⏳ Acompanhando (a Setta está cuidando)</div>'+ou.map(card).join(''):'');return}
  m.innerHTML=f+rs0+(l.length?l.map(card).join(''):'<div class="empty">'+(tab==='andamento'?'Nenhum pedido em andamento.':'Nenhum pedido nesta aba.')+'</div>');
}
document.addEventListener('change',function(e){var s=e.target;if(s.classList&&s.classList.contains('mes')){mesSel=s.value;render();return}if(s.matches&&s.matches('select[data-out]')){var n=s.nextElementSibling;if(n)n.style.display=s.value==='__outro'?'block':'none'}});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,c=b.closest('.card'),id=c&&c.dataset.id,o=id&&orders[id];
  if(a==='tab'){document.body.classList.remove('menu');tab=v;confirmDel=null;editing=null;mesSel=null;if(v==='novo')draft.foco=true;if(busca){busca='';document.getElementById('busca').value=''}render()}
  else if(a==='pdf'){baixarPdf()}
  else if(a==='filtro'){filtro=v;render()}
  else if(a==='dfilial'||a==='dst'){saveDraft(c);if(a==='dfilial')draft.filial=v;else draft.st=v;render()}
  else if(a==='add'){
    saveDraft(c);var n=draft.num.trim();
    if(!n){toast('Informe o número do pedido');return}
    if(Object.values(orders).some(function(x){return x.numero===n&&x.filial===draft.filial})){toast('Este pedido já existe nesta filial');return}
    var dest=draft.st,ord={numero:n,filial:draft.filial,status:dest,correcao:false,itens:[],criado:Date.now()};
    if(dest==='separacao'){var sp=nameVal(c,'nsep');if(!sp){toast('Informe o separador');return}ord.separador=sp}
    draft.num='';draft.foco=true;
    recentes.unshift({numero:n,filial:draft.filial,etapa:ST[dest]});recentes=recentes.slice(0,5);
    save('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ord);
    toast('Pedido '+n+' cadastrado em '+ST[dest]);
  }
  else if(a==='finsep'&&o){save(id,{status:'conferido'});toast('Enviado para Aguardando Conferência')}
  else if(a==='finconf'&&o){
    var vol=c.querySelector('.vol').value.trim(),cf=nameVal(c,'cf'),em=nameVal(c,'em');
    if(!vol||+vol<1){toast('Informe a quantidade de volumes');return}
    if(!cf){toast('Informe quem conferiu');return}
    if(!em){toast('Informe quem embalou');return}
    save(id,{volumes:vol,conferiu:cf,embalou:em,status:'nf'});toast('Enviado para Aguardando NF');
  }
  else if(a==='finnf'&&o){var nfn=c.querySelector('.nfn').value.trim();if(!nfn){toast('Digite o número da NF');return}save(id,{nfNumero:nfn,status:'aguardando'});toast('Enviado para Aguardando Entrega')}
  else if(a==='entregue'&&o){
    save(id,{status:'conferencia'});toast('🎉 Recebimento confirmado! Agora confira o pedido.');
  }
  else if(a==='corr'&&o){save(id,Object.assign(collect(c),{correcao:v==='1'}))}
  else if(a==='tipo'){tipo=v;c.querySelectorAll('[data-a="tipo"]').forEach(function(x){x.classList.toggle('on',x.dataset.v===v)})}
  else if(a==='sinal'){sinal=v;c.querySelectorAll('[data-a="sinal"]').forEach(function(x){x.classList.toggle('on',x.dataset.v===v)})}
  else if(a==='item'&&o){
    var p=c.querySelector('.p').value.trim(),q=c.querySelector('.q').value.trim();
    if(!p||!q||+q<1){toast('Informe produto e quantidade');return}
    save(id,Object.assign(collect(c),{itens:(o.itens||[]).concat([{produto:p,tipo:tipo,qtd:(sinal==='-'?-1:1)*Math.abs(+q)}])}));
  }
  else if(a==='del'&&o){var it=(o.itens||[]).slice();it.splice(+v,1);save(id,Object.assign(collect(c),{itens:it}))}
  else if(a==='finent'&&o){
    var pp=collect(c);
    if(o.correcao&&!(o.itens||[]).length&&!pp.obs){toast('Informe o item ou a observação da correção');return}
    pp.status=o.correcao?'correcao':'finalizado';
    if(pp.status==='finalizado')pp.finalizadoEm=Date.now();
    save(id,pp);toast(o.correcao?'⚠️ Enviado para correção':'🎉 Pedido finalizado, obrigado!');
  }
  else if(a==='aprovar'&&o){save(id,{status:'finalizado',finalizadoEm:Date.now()});toast('Pedido finalizado')}
  else if(a==='editar'){editing=id;render()}
  else if(a==='ecancelar'){editing=null;render()}
  else if(a==='esalvar'&&o){
    var g=function(k){var el=c.querySelector('.e_'+k);return el?el.value.trim():''};
    var pe={numero:g('numero'),filial:g('filial'),status:g('status'),correcao:g('correcao')==='1',obs:g('obs')};
    ['separador','volumes','conferiu','embalou','nfNumero','volRecebidos','conferiuEntrega'].forEach(function(k){pe[k]=g(k)});
    if(!pe.numero){toast('Informe o número do pedido');return}
    if(pe.status==='finalizado'&&!o.finalizadoEm)pe.finalizadoEm=Date.now();
    editing=null;save(id,pe);toast('Pedido atualizado');
  }
  else if(a==='excluir'&&o){confirmDel=id;render()}
  else if(a==='excluir-nao'){confirmDel=null;render()}
  else if(a==='excluir-sim'&&o){removeOrder(id);toast('Pedido excluído')}
});

onAuthStateChanged(auth,function(user){
  if(unsub){unsub();unsub=null}
  if(!user){showLogin(badMsg);badMsg='';return}
  var un=(user.email||'').split('@')[0].toLowerCase();

  tab=role==='entregador'?'aguardando':(role==='filial'?'andamento':'novo');filtro='todas';render();
  var col=collection(fdb,'pedidos_setta');
  var q=role==='admin'?col:(role==='entregador'?query(col,where('status','==','aguardando')):role==='separador'?query(col,where('status','in',['separacao','conferido','nf','aguardando'])):query(col,where('filial','==',me.filial),where('status','in',['separacao','conferido','nf','aguardando','conferencia','finalizado'])));
  unsub=onSnapshot(q,function(s){
    var n={};s.forEach(function(d){n[d.id]=d.data()});orders=n;
    if(document.activeElement&&document.activeElement.id!=='busca'&&document.activeElement.matches('input,select,textarea')){pending=true}else render();
