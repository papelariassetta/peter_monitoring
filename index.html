<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoramento de Pedidos Setta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Versão dos arquivos: aumente o número (v=1 -> v=2) quando mudar algo, para o navegador pegar a versão nova -->
<link rel="stylesheet" href="estilo.css?v=1">
</head>
<body>
<!-- Tela de login -->
<div class="wrap" id="login" style="max-width:380px;display:none;margin-top:8vh">
<div style="display:flex;justify-content:center;margin-bottom:16px"><div class="logo" role="img" aria-label="Setta Papelaria"></div></div>
<div class="card"><h1 style="font-size:18px">Monitoramento de Pedidos Setta</h1>
<form id="lform"><label>Usuário</label><input id="lu" autocomplete="username" autocapitalize="none" autocorrect="off"><label>Senha</label><input id="lp" type="password" autocomplete="current-password"><div id="lerr" class="bad" style="min-height:22px;margin-top:8px"></div><button class="fin" type="submit" style="width:100%;margin-top:6px">Entrar</button></form></div></div>

<!-- Sistema (menu lateral + conteúdo) -->
<div id="app" style="display:none"><div class="shell">
<aside id="side"><div class="logo" role="img" aria-label="Setta Papelaria"></div><span class="chip" id="who" style="align-self:flex-start"></span><nav id="nav"></nav></aside>
<div id="scrim"></div>
<section class="content">
<div class="bar topbar"><button id="menuBtn" aria-label="Abrir menu">☰</button><div class="hello"><span id="saud" class="saud"></span><h1>Monitoramento de Pedidos Setta</h1></div><button id="out" class="sair">Sair</button></div>
<input id="busca" type="search" placeholder="🔍 Buscar pedido (nº do pedido ou da NF)" style="margin-bottom:10px">
<main id="main"></main>
<footer class="foot"><div class="logo" role="img" aria-label="Setta Papelaria"></div></footer>
</section></div></div>

<div id="toast"></div>
<script type="module" src="app.js?v=2"></script>
</body>
</html>
