@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mut:#9aa1ab;--bd:#2f343b;--ac:#6b9bff;--acx:#0b1220;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mut:#9aa1ab;--bd:#2f343b;--ac:#6b9bff;--acx:#0b1220;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:132px;aspect-ratio:300/105;padding:7px;box-sizing:content-box;background:#17191d var(--logo) center/contain no-repeat;background-origin:content-box;border-radius:10px}.foot{display:flex;justify-content:flex-end;margin-top:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}.chip{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:2px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
nav button{white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.fin{background:var(--ok);color:#fff;border-color:var(--ok)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.dangerx{background:var(--bad);color:#fff;border-color:var(--bad)}
.badge{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--bd);font-size:12px}
nav button.on .badge{background:rgba(255,255,255,.25)}
input,select,textarea{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 10px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.num{font-weight:700;font-size:17px}.mut{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.filter{margin-bottom:10px}.empty{text-align:center;color:var(--mut);padding:28px 0}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}th{font-size:12px;color:var(--mut)}.item{display:flex;justify-content:space-between;border-top:1px dashed var(--bd);padding:6px 0}
.item button{padding:2px 8px}.bad{color:var(--bad)}.okc{color:var(--ok)}
.add{display:grid;grid-template-columns:2fr 1fr auto;gap:6px;margin-top:8px}
.sg{margin-top:8px}.sg button{min-width:84px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
#toast.s{opacity:1}

<body>
<div class="wrap" id="login" style="max-width:380px;display:none;margin-top:8vh">
<div style="display:flex;justify-content:center;margin-bottom:16px"><div class="logo" role="img" aria-label="Setta Papelaria"></div></div>
<div class="card"><h1 style="font-size:18px">Monitoramento de Pedidos Setta</h1>
<form id="lform"><label>Usuário</label><input id="lu" autocomplete="username" autocapitalize="none" autocorrect="off"><label>Senha</label><input id="lp" type="password" autocomplete="current-password"><div id="lerr" class="bad" style="min-height:22px;margin-top:8px"></div><button class="fin" type="submit" style="width:100%;margin-top:6px">Entrar</button></form></div></div>
<div class="wrap" id="app" style="display:none">
<header><div class="brand"><div class="logo" role="img" aria-label="Setta Papelaria"></div><h1>Monitoramento de Pedidos Setta</h1></div><div class="row"><span class="chip" id="who"></span><button id="out">Sair</button></div></header>
<nav id="nav"></nav>
<main id="main"></main>
<footer class="foot"><div class="logo" role="img" aria-label="Setta Papelaria"></div></footer>
</div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,where,onSnapshot,doc,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
var FILIAIS=['Setta 1 Matriz','Setta 3 Conteúdo','Setta 4 Centro','Setta 5 Pirajá'];
var ST={separacao:'Em Separação',conferido:'Aguardando Conferência',aguardando:'Aguardando Entrega',conferencia:'Conferência de Entrega',correcao:'Precisa de Correção',finalizado:'Finalizados'};
var BTN=[['separacao','Em separação'],['conferido','Aguardando conferência'],['aguardando','Aguardando entrega'],['conferencia','Entregue']];
var SEPS=['Auricelia','Caio','Italu','Pedro','Tarciano','Wesley'];
var EQUIPE=['Auricelia','Caio','Edmilson','Hebert','Igor','Italu','Maycon','Osmar','Pedro','Sandra','Tarciano','Wesley'];
var orders={},tab='novo',filtro='todas',pending=false,confirmDel=null,editing=null,sinal='+',tipo='NF',draft={num:'',filial:FILIAIS[0],st:'separacao',sep:'',sepo:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='s';setTimeout(function(){t.className=''},2400)}
function fmt(t){return t?new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):''}
function fmtQ(q){q=+q;return '<span class="'+(q<0?'bad':'okc')+'">'+(q<0?'−':'+')+Math.abs(q)+' un.</span>'}
function btns(){return isSeparador()?BTN.slice(0,3):BTN}
function tabs(){if(isEntregador())return['aguardando'];if(isSeparador())return['separacao','conferido','aguardando'];var t=['separacao','conferido','aguardando','conferencia'];if(isAdmin())t.push('correcao');t.push('finalizado');if(isAdmin())t.push('relatorio');return t}
function list(st){return Object.values(orders).filter(function(o){return o.status===st&&(filtro==='todas'||o.filial===filtro)}).sort(function(a,b){return (b.atualizado||0)-(a.atualizado||0)})}
function count(st){return Object.values(orders).filter(function(o){return o.status===st}).length}
function save(id,patch){
  var o=Object.assign({},orders[id]||{},patch,{id:id,atualizado:Date.now()});
  orders[id]=o;render();
  setDoc(doc(fdb,'pedidos_setta',id),o).catch(function(){toast('Sem permissão para salvar')});
}
function removeOrder(id){
  delete orders[id];confirmDel=null;render();
  deleteDoc(doc(fdb,'pedidos_setta',id)).catch(function(){toast('Sem permissão para excluir')});
}
function nameSel(cls,list,label){return '<label>'+label+'</label><select class="'+cls+'" data-out="1"><option value="">Selecione…</option>'+list.map(function(n){return '<option>'+n+'</option>'}).join('')+'<option value="__outro">Outro</option></select><input class="'+cls+'o" placeholder="Nome" style="display:none;margin-top:6px">'}
function nameVal(c,cls){var s=c.querySelector('.'+cls);if(!s)return '';return s.value==='__outro'?c.querySelector('.'+cls+'o').value.trim():s.value}
function collect(c){var p={},ob=c.querySelector('.ob'),ce=c.querySelector('.ce');if(ob)p.obs=ob.value.trim();if(ce)p.conferiuEntrega=ce.value.trim();return p}
function saveDraft(c){var n=c.querySelector('#num');if(n)draft.num=n.value;var s=c.querySelector('.nsep');if(s){draft.sep=s.value;var so=c.querySelector('.nsepo');draft.sepo=so?so.value:''}}
function infoLine(o){var p=[];
  if(o.separador)p.push('Separador: <b>'+esc(o.separador)+'</b>');
  if(o.volumes)p.push('Volumes: <b>'+esc(o.volumes)+'</b>');
  if(o.conferiu)p.push('Conferiu: <b>'+esc(o.conferiu)+'</b>');
  if(o.embalou)p.push('Embalou: <b>'+esc(o.embalou)+'</b>');
  if(o.volRecebidos!==undefined&&o.volRecebidos!=='')p.push('Volumes recebidos: <b>'+esc(o.volRecebidos)+'</b>');
  if(o.conferiuEntrega)p.push('Conf. de entrega: <b>'+esc(o.conferiuEntrega)+'</b>');
  return p.length?'<div class="mut" style="margin-bottom:6px">'+p.join(' · ')+'</div>':''}
function itensHtml(o,del){return (o.itens||[]).map(function(i,n){return '<div class="item"><span>'+(i.tipo?'<b>'+esc(i.tipo)+'</b> · ':'')+'Produto '+esc(i.produto)+' — '+fmtQ(i.qtd)+'</span>'+(del?'<button data-a="del" data-v="'+n+'">✕</button>':'')+'</div>'}).join('')}
function confEntrega(o){
  var h='<div class="row" style="margin-bottom:6px"><button data-a="corr" data-v="0" class="'+(!o.correcao?'on':'')+'">Sem correção</button><button data-a="corr" data-v="1" class="'+(o.correcao?'on':'')+'">Precisa de correção</button></div>';
  if(o.correcao){
    h+=itensHtml(o,true);
    h+='<div class="row sg"><button data-a="tipo" data-v="NF" class="'+(tipo==='NF'?'on':'')+'">NF</button><button data-a="tipo" data-v="Pedido" class="'+(tipo==='Pedido'?'on':'')+'">Pedido</button></div>';
    h+='<div class="row sg"><button data-a="sinal" data-v="-" class="'+(sinal==='-'?'on':'')+'">− Menos</button><button data-a="sinal" data-v="+" class="'+(sinal==='+'?'on':'')+'">+ Mais</button></div>';
    h+='<div class="add"><input class="p" placeholder="Nº do produto"><input class="q" type="number" min="1" placeholder="Qtd"><button data-a="item">Adicionar</button></div>';
    h+='<label>Observação (o que precisa ser feito)</label><textarea class="ob" rows="3">'+esc(o.obs||'')+'</textarea>';
  }
  h+='<label>Conferido por (nome)</label><input class="ce" value="'+esc(o.conferiuEntrega||'')+'">';
  return h+'<div style="margin-top:12px"><button class="fin" data-a="finent">Finalizar conferência de entrega</button></div>';
}
function actions(o){
  var s=o.status,ad=isAdmin(),sp=isSeparador(),fi=isFilial();
  if(s==='separacao'&&(ad||sp))return '<button class="fin" data-a="finsep">Finalizada a separação</button>';
  if(s==='conferido'&&(ad||sp))return '<div style="max-width:160px"><label>Volumes</label><input class="vol" type="number" min="1" value="'+esc(o.volumes||'')+'"></div>'+nameSel('cf',EQUIPE,'Conferido por:')+nameSel('em',EQUIPE,'Embalado por:')+'<div style="margin-top:12px"><button class="fin" data-a="finconf">Finalizada a conferência</button></div>';
  if(s==='aguardando'&&(ad||fi))return '<div style="max-width:180px"><label>Volumes recebidos</label><input class="volr" type="number" min="0"></div><div style="margin-top:12px"><button class="fin" data-a="entregue">Entregue</button></div>';
  if(s==='conferencia'&&(ad||fi))return confEntrega(o);
  if(s==='correcao'&&ad)return '<button class="fin" data-a="aprovar">Aprovar correção e finalizar</button>';
  return '';
}
function editForm(o){
  function opt(a,v,l){return '<option value="'+esc(a)+'"'+(a===v?' selected':'')+'>'+esc(l||a)+'</option>'}
  var h='<div class="row"><div style="flex:1;min-width:130px"><label>Número</label><input class="e_numero" value="'+esc(o.numero)+'"></div>'+
   '<div style="flex:1;min-width:160px"><label>Filial</label><select class="e_filial">'+FILIAIS.map(function(x){return opt(x,o.filial)}).join('')+'</select></div>'+
   '<div style="flex:1;min-width:170px"><label>Status</label><select class="e_status">'+Object.keys(ST).map(function(k){return opt(k,o.status,ST[k])}).join('')+'</select></div></div>';
  [['separador','Separador'],['volumes','Volumes'],['conferiu','Conferido por'],['embalou','Embalado por'],['volRecebidos','Volumes recebidos'],['conferiuEntrega','Conferência de entrega por']].forEach(function(x){h+='<label>'+x[1]+'</label><input class="e_'+x[0]+'" value="'+esc(o[x[0]])+'">'});
  h+='<label>Precisa de correção?</label><select class="e_correcao">'+opt('0',o.correcao?'1':'0','Não')+opt('1',o.correcao?'1':'0','Sim')+'</select>';
  h+=itensHtml(o,true)+'<label>Observação</label><textarea class="e_obs" rows="3">'+esc(o.obs||'')+'</textarea>';
  return h+'<div class="row" style="margin-top:12px"><button class="fin" data-a="esalvar">Salvar alterações</button><button data-a="ecancelar">Cancelar</button></div>';
}
function card(o){
  var ed=isAdmin()&&editing===o.id;
  var h='<div class="card" data-id="'+esc(o.id)+'"><div class="top"><div><span class="num">Pedido '+esc(o.numero)+'</span><div class="mut">'+esc(o.filial)+' · atualizado '+fmt(o.atualizado)+'</div></div>'+(o.status==='finalizado'?'<span class="okc">✔ Finalizado '+fmt(o.finalizadoEm)+'</span>':'')+'</div>';
  if(ed)return h+editForm(o)+'</div>';
  h+=infoLine(o);
  if(o.status==='finalizado'||o.status==='correcao'){h+=(o.correcao?'<div class="bad">Houve correção:</div>':'<div class="mut">Sem correções.</div>')+itensHtml(o,false)+(o.obs?'<div style="margin:6px 0"><span class="mut">Observação:</span> '+esc(o.obs)+'</div>':'')}
  var a=actions(o);
  h+=a||(o.status==='finalizado'?'':'<div class="mut" style="margin-top:8px">Somente consulta nesta etapa.</div>');
  if(isAdmin())h+='<div class="row" style="margin-top:12px"><button data-a="editar">Editar pedido</button>'+(confirmDel===o.id?'<span class="bad">Excluir este pedido?</span><button class="dangerx" data-a="excluir-sim">Sim, excluir</button><button data-a="excluir-nao">Cancelar</button>':'<button class="danger" data-a="excluir">Excluir pedido</button>')+'</div>';
  return h+'</div>';
}
function relatorio(){
  var P={},all=Object.values(orders),comErro=0;
  function pes(n){n=(n||'').trim();if(!n)return null;var k=n.toLowerCase();return P[k]||(P[k]={nome:n,sep:0,conf:0,emb:0,ent:0,esep:0,econf:0,eemb:0})}
  function cel(n,e){return '<td><b>'+n+'</b>'+(e?' <span class="bad">· '+e+' erro'+(e>1?'s':'')+'</span>':'')+'</td>'}
  all.forEach(function(o){
    var err=o.correcao===true&&(o.status==='correcao'||o.status==='finalizado'),a;
    if(err)comErro++;
    if(o.status!=='separacao'&&(a=pes(o.separador))){a.sep++;if(err)a.esep++}
    if(a=pes(o.conferiu)){a.conf++;if(err)a.econf++}
    if(a=pes(o.embalou)){a.emb++;if(err)a.eemb++}
    if(a=pes(o.conferiuEntrega))a.ent++;
  });
  var rows=Object.values(P).sort(function(a,b){return (b.sep+b.conf+b.emb+b.ent)-(a.sep+a.conf+a.emb+a.ent)});
  var h='<div class="card"><b>'+all.length+'</b> pedidos no total · <span class="bad"><b>'+comErro+'</b> com correção</span></div>';
  if(!rows.length)return h+'<div class="empty">Ainda não há atividades registradas.</div>';
  h+='<div class="card" style="overflow-x:auto"><table><thead><tr><th>Pessoa</th><th>Separações</th><th>Conferências</th><th>Embalagens</th><th>Conf. de entrega</th><th>Total de erros</th><th>% de acerto</th></tr></thead><tbody>';
  rows.forEach(function(p){var te=p.esep+p.econf+p.eemb,tf=p.sep+p.conf+p.emb,pc=tf?(((tf-te)/tf)*100).toFixed(1).replace('.',',')+'%':'—';
    h+='<tr><td><b>'+esc(p.nome)+'</b></td>'+cel(p.sep,p.esep)+cel(p.conf,p.econf)+cel(p.emb,p.eemb)+'<td><b>'+p.ent+'</b></td><td class="'+(te?'bad':'mut')+'"><b>'+te+'</b></td><td><b>'+pc+'</b></td></tr>'});
  return h+'</tbody></table></div><div class="mut">Erro = pedido que precisou de correção na conferência de entrega, contado para o separador, o conferente e o embalador daquele pedido. % de acerto = (separações + conferências + embalagens − erros) ÷ (separações + conferências + embalagens).</div>';
}
function render(){
  var tl=tabs();
  if(tab==='novo'&&(isFilial()||isEntregador()))tab=tl[0];
  if(tab!=='novo'&&tl.indexOf(tab)<0)tab=tl[0];
  var nav=(isFilial()||isEntregador())?'':'<button data-a="tab" data-v="novo" class="'+(tab==='novo'?'on':'')+'">+ Novo pedido</button>';
  tl.forEach(function(k){nav+='<button data-a="tab" data-v="'+k+'" class="'+(tab===k?'on':'')+'">'+(k==='relatorio'?'Relatório':ST[k]+'<span class="badge">'+count(k)+'</span>')+'</button>'});
  document.getElementById('nav').innerHTML=nav;
  var m=document.getElementById('main');
  if(tab==='novo'){
    var fo=FILIAIS.map(function(x){return '<button data-a="dfilial" data-v="'+esc(x)+'" class="'+(draft.filial===x?'on':'')+'">'+esc(x)+'</button>'}).join('');
    if(!seeAll())fo='<span class="chip">'+esc(me.filial)+'</span>';
    var so=btns().map(function(b){return '<button data-a="dst" data-v="'+b[0]+'" class="'+(draft.st===b[0]?'on':'')+'">'+b[1]+'</button>'}).join('');
    m.innerHTML='<div class="card"><label>Número do pedido</label><input id="num" inputmode="numeric" value="'+esc(draft.num)+'" placeholder="Ex.: 12345"><label>Filial</label><div class="row">'+fo+'</div><label>Status do pedido</label><div class="row">'+so+'</div>'+(draft.st==='separacao'?nameSel('nsep',SEPS,'Separador:'):'')+'<div style="margin-top:14px"><button class="fin" data-a="add">Processar pedido</button></div></div>';
    var s=m.querySelector('.nsep');
    if(s&&draft.sep){s.value=draft.sep;if(s.value==='__outro'){var oo=m.querySelector('.nsepo');oo.style.display='block';oo.value=draft.sepo}}
    return;
  }
  if(tab==='relatorio'){m.innerHTML=relatorio();return}
  var f=!seeAll()?'':'<div class="filter row"><span class="mut">Filial:</span>'+['todas'].concat(FILIAIS).map(function(x){return '<button data-a="filtro" data-v="'+esc(x)+'" class="'+(filtro===x?'on':'')+'">'+(x==='todas'?'Todas':esc(x))+'</button>'}).join('')+'</div>';
  var l=list(tab);
  m.innerHTML=f+(l.length?l.map(card).join(''):'<div class="empty">Nenhum pedido nesta aba.</div>');
}
document.addEventListener('change',function(e){var s=e.target;if(s.matches&&s.matches('select[data-out]')){var n=s.nextElementSibling;if(n)n.style.display=s.value==='__outro'?'block':'none'}});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,c=b.closest('.card'),id=c&&c.dataset.id,o=id&&orders[id];
  if(a==='tab'){tab=v;confirmDel=null;editing=null;render()}
  else if(a==='filtro'){filtro=v;render()}
  else if(a==='dfilial'||a==='dst'){saveDraft(c);if(a==='dfilial')draft.filial=v;else draft.st=v;render()}
  else if(a==='add'){
    saveDraft(c);var n=draft.num.trim();
    if(!n){toast('Informe o número do pedido');return}
    if(Object.values(orders).some(function(x){return x.numero===n&&x.filial===draft.filial})){toast('Este pedido já existe nesta filial');return}
    var dest=draft.st,ord={numero:n,filial:draft.filial,status:dest,correcao:false,itens:[],criado:Date.now()};
    if(dest==='separacao'){var sp=nameVal(c,'nsep');if(!sp){toast('Informe o separador');return}ord.separador=sp}
    draft.num='';draft.sep='';draft.sepo='';
    save('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ord);
    tab=dest;render();toast('Pedido enviado para '+ST[dest]);
  }
  else if(a==='finsep'&&o){save(id,{status:'conferido'});toast('Enviado para Aguardando Conferência')}
  else if(a==='finconf'&&o){
    var vol=c.querySelector('.vol').value.trim(),cf=nameVal(c,'cf'),em=nameVal(c,'em');
    if(!vol||+vol<1){toast('Informe a quantidade de volumes');return}
    if(!cf){toast('Informe quem conferiu');return}
    if(!em){toast('Informe quem embalou');return}
    save(id,{volumes:vol,conferiu:cf,embalou:em,status:'aguardando'});toast('Enviado para Aguardando Entrega');
  }
  else if(a==='entregue'&&o){
    var vr=c.querySelector('.volr').value.trim();
    if(vr===''||+vr<0){toast('Informe quantos volumes recebeu');return}
    save(id,{volRecebidos:vr,status:'conferencia'});toast('Enviado para Conferência de Entrega');
  }
  else if(a==='corr'&&o){save(id,Object.assign(collect(c),{correcao:v==='1'}))}
  else if(a==='tipo'){tipo=v;c.querySelectorAll('[data-a="tipo"]').forEach(function(x){x.classList.toggle('on',x.dataset.v===v)})}
  else if(a==='sinal'){sinal=v;c.querySelectorAll('[data-a="sinal"]').forEach(function(x){x.classList.toggle('on',x.dataset.v===v)})}
  else if(a==='item'&&o){
    var p=c.querySelector('.p').value.trim(),q=c.querySelector('.q').value.trim();
    if(!p||!q||+q<1){toast('Informe produto e quantidade');return}
    save(id,Object.assign(collect(c),{itens:(o.itens||[]).concat([{produto:p,tipo:tipo,qtd:(sinal==='-'?-1:1)*Math.abs(+q)}])}));
  }
  else if(a==='del'&&o){var it=(o.itens||[]).slice();it.splice(+v,1);save(id,Object.assign(collect(c),{itens:it}))}
  else if(a==='finent'&&o){
    var pp=collect(c);
    if(!pp.conferiuEntrega){toast('Informe quem conferiu');return}
    if(o.correcao&&!(o.itens||[]).length&&!pp.obs){toast('Informe o item ou a observação da correção');return}
    pp.status=o.correcao?'correcao':'finalizado';
    if(pp.status==='finalizado')pp.finalizadoEm=Date.now();
    save(id,pp);toast(o.correcao?'Enviado para Precisa de Correção':'Pedido finalizado');
  }
  else if(a==='aprovar'&&o){save(id,{status:'finalizado',finalizadoEm:Date.now()});toast('Pedido finalizado')}
  else if(a==='editar'){editing=id;render()}
  else if(a==='ecancelar'){editing=null;render()}
  else if(a==='esalvar'&&o){
    var g=function(k){var el=c.querySelector('.e_'+k);return el?el.value.trim():''};
    var pe={numero:g('numero'),filial:g('filial'),status:g('status'),correcao:g('correcao')==='1',obs:g('obs')};
    ['separador','volumes','conferiu','embalou','volRecebidos','conferiuEntrega'].forEach(function(k){pe[k]=g(k)});
    if(!pe.numero){toast('Informe o número do pedido');return}
    if(pe.status==='finalizado'&&!o.finalizadoEm)pe.finalizadoEm=Date.now();
    editing=null;save(id,pe);toast('Pedido atualizado');
  }
  else if(a==='excluir'&&o){confirmDel=id;render()}
  else if(a==='excluir-nao'){confirmDel=null;render()}
  else if(a==='excluir-sim'&&o){removeOrder(id);toast('Pedido excluído')}
});
document.addEventListener('focusout',function(){setTimeout(function(){if(pending&&!document.activeElement.matches('input,select,textarea')){pending=false;render()}},50)});

var app=initializeApp(firebaseConfig),auth=getAuth(app),fdb=getFirestore(app);
var DOM='@setta.app',me=null,unsub=null,badMsg='';
var MAP={matriz:'Setta 1 Matriz',conteudo:'Setta 3 Conteúdo',centro:'Setta 4 Centro',piraja:'Setta 5 Pirajá'};
function isAdmin(){return !!me&&me.role==='admin'}
function isSeparador(){return !!me&&me.role==='separador'}
function seeAll(){return isAdmin()||isSeparador()||isEntregador()}
function isFilial(){return !!me&&me.role==='filial'}
function isEntregador(){return !!me&&me.role==='entregador'}
function showLogin(msg){
  orders={};me=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='block';
  document.getElementById('lerr').textContent=msg||'';
  document.getElementById('lp').value='';
}
document.getElementById('lform').addEventListener('submit',function(e){
  e.preventDefault();
  var u=document.getElementById('lu').value.trim().toLowerCase().split('@')[0],p=document.getElementById('lp').value;
  if(!u||!p)return;
  document.getElementById('lerr').textContent='';
  signInWithEmailAndPassword(auth,u+DOM,p).catch(function(){document.getElementById('lerr').textContent='Usuário ou senha incorretos.'});
});
document.getElementById('out').addEventListener('click',function(){signOut(auth)});
onAuthStateChanged(auth,function(user){
  if(unsub){unsub();unsub=null}
  if(!user){showLogin(badMsg);badMsg='';return}
  var un=(user.email||'').split('@')[0].toLowerCase();
  var role=un==='admin'?'admin':(un==='separador'?'separador':(un==='entregador'?'entregador':(MAP[un]?'filial':null)));
  if(!role){badMsg='Este usuário não tem acesso ao sistema.';signOut(auth);return}
  me={user:un,role:role,filial:MAP[un]||null};
  if(role==='filial')draft.filial=me.filial;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('who').textContent=role==='admin'?'Administrador':(role==='separador'?'Separação':(role==='entregador'?'Entregador':me.filial));
  tab=(role==='filial'||role==='entregador')?'aguardando':'novo';filtro='todas';render();
  var col=collection(fdb,'pedidos_setta');
  var q=role==='admin'?col:(role==='entregador'?query(col,where('status','==','aguardando')):role==='separador'?query(col,where('status','in',['separacao','conferido','aguardando'])):query(col,where('filial','==',me.filial),where('status','in',['separacao','conferido','aguardando','conferencia','finalizado'])));
  unsub=onSnapshot(q,function(s){
    var n={};s.forEach(function(d){n[d.id]=d.data()});orders=n;
    if(document.activeElement&&document.activeElement.matches('input,select,textarea')){pending=true}else render();
  },function(){toast('Sem permissão para ler os pedidos')});
});
